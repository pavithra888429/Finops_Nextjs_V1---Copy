AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  FinOps Platform - Configure AWS Account (Phase 1: Connectivity).
  Creates the cross-account IAM role used to establish and verify the
  AWS connection. Does NOT grant any Cost and Usage Report, S3, or
  billing-data permissions — those are added by the separate
  "Configure Cloud Cost" (Phase 2) template once this connection is
  verified.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Required
        Parameters:
          - PlatformAccountId
          - ExternalId
      - Label:
          default: Advanced (optional)
        Parameters:
          - IAMRoleName
    ParameterLabels:
      PlatformAccountId:
        default: "FinOps Platform Account ID *"
      ExternalId:
        default: "External ID *"
      IAMRoleName:
        default: "IAM Role Name"

Parameters:
  PlatformAccountId:
    Type: String
    Description: >-
      AWS Account ID of the FinOps platform. This is the platform's
      own account, allowed to assume the role created below. DO NOT
      CHANGE unless you are pointing this deployment at a different
      FinOps platform account.
    AllowedPattern: '^[0-9]{12}$'

  ExternalId:
    Type: String
    Description: >-
      Unique External ID generated by the FinOps platform for this
      specific connection. Prevents the confused-deputy problem —
      only requests carrying this exact value can assume the role.
    NoEcho: true
    MinLength: 8

  IAMRoleName:
    Type: String
    Default: FinOpsAwsIntegrationRole
    Description: Name of the IAM role created in your AWS account.

Resources:
  FinOpsAwsIntegrationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref IAMRoleName
      Description: >-
        Cross-account role assumed by the FinOps platform to verify this AWS connection. Phase 1 only - carries no cost-data or billing permissions.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${PlatformAccountId}:root'
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref ExternalId
      Tags:
        - Key: ManagedBy
          Value: FinOpsPlatform
        - Key: Purpose
          Value: AwsAccountConnectivity

  FinOpsConnectivityVerificationPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: FinOpsConnectivityVerificationPolicy
      Roles:
        - !Ref FinOpsAwsIntegrationRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountIdentityRead
            Effect: Allow
            Action:
              - 'account:GetAccountInformation'
              - 'iam:ListAccountAliases'
            Resource: '*'
          - Sid: OrganizationContextRead
            Effect: Allow
            Action:
              - 'organizations:DescribeAccount'
              - 'organizations:DescribeOrganization'
            Resource: '*'

Outputs:
  RoleArn:
    Description: ARN of the role the FinOps platform will assume via STS.
    Value: !GetAtt FinOpsAwsIntegrationRole.Arn

  RoleName:
    Description: Name of the created IAM role.
    Value: !Ref IAMRoleName